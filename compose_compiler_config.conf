// Compose compiler stability configuration
// https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file
//
// Lists types that the Compose compiler must treat as stable even if it cannot
// infer stability. Avoids over-recomposition of LazyRow/LazyColumn items and
// allows data classes from the pure-Kotlin :domain module to skip recomposition.

// Domain models (pure Kotlin module, cannot depend on androidx.compose)
com.streamvault.domain.model.**

// Kotlin stdlib collections (treated as read-only here; we never mutate instances
// stored in UI state — all updates go through StateFlow with fresh lists).
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection

// Immutable collections (kotlinx.collections.immutable, transitively pulled)
kotlinx.collections.immutable.**

// Time types
kotlinx.datetime.**
java.time.**

// Android framework value types used in UI state
android.net.Uri
